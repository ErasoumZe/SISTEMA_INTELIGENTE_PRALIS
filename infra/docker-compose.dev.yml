services:
  api:
    volumes:
      - ..:/app
      - padaria_node_modules:/app/node_modules
    command: ["npm", "run", "dev", "--workspace", "@padaria/api"]

  web-vue:
    volumes:
      - ..:/app
      - padaria_node_modules:/app/node_modules
    command: >
      sh -c "npm run dev --workspace @padaria/web-vue -- --host 0.0.0.0 --port 5174"

volumes:
  padaria_node_modules:
