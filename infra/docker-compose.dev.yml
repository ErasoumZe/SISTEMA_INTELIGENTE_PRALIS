services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile.dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-padaria}:${POSTGRES_PASSWORD:-padaria}@db:5432/${POSTGRES_DB:-padaria}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me-dev-secret-change-me}
      AUTH_BASE_URL: http://localhost:${API_PORT:-4100}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-5174}
      PORT: ${API_PORT:-4100}
      HOST: 0.0.0.0
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: 300
      WATCHPACK_POLLING: "true"
      WATCHFILES_FORCE_POLLING: "true"
      TSC_WATCHFILE: FixedPollingInterval
      # Leitura fiscal assistida: opcional no desenvolvimento e fornecida exclusivamente pelo
      # `.env.local` ignorado. A chave nunca vai para a imagem, o front ou o Git.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-90000}
    ports:
      - "127.0.0.1:${API_PORT:-4100}:${API_PORT:-4100}"
    volumes:
      - ..:/app
      - padaria_dev_node_modules:/app/node_modules
      - padaria_dev_api_node_modules:/app/api/node_modules
      - padaria_dev_db_node_modules:/app/db/node_modules
      - padaria_dev_shared_node_modules:/app/shared/node_modules
      - padaria_dev_web_vue_node_modules:/app/web-vue/node_modules
      - padaria_dev_tests_node_modules:/app/tests/node_modules
      - padaria_dev_integracoes_scripts_node_modules:/app/integracoes-scripts/node_modules
    command: ["node", "--conditions=development", "--import", "tsx", "--watch", "api/src/server.ts"]
    networks:
      - padaria_dev

volumes:
  padaria_dev_node_modules:
    name: padaria_dev_node_modules
  padaria_dev_api_node_modules:
    name: padaria_dev_api_node_modules
  padaria_dev_db_node_modules:
    name: padaria_dev_db_node_modules
  padaria_dev_shared_node_modules:
    name: padaria_dev_shared_node_modules
  padaria_dev_web_vue_node_modules:
    name: padaria_dev_web_vue_node_modules
  padaria_dev_tests_node_modules:
    name: padaria_dev_tests_node_modules
  padaria_dev_integracoes_scripts_node_modules:
    name: padaria_dev_integracoes_scripts_node_modules

networks:
  padaria_dev:
    external: true
    name: padaria_dev
