services:
  migrate:
    build:
      context: ..
      dockerfile: api/Dockerfile.prod
      target: build
    command: ["npm", "run", "api:prod:migrate", "--workspace", "@padaria/api"]
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obrigatorio}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET obrigatorio}
      AUTH_BASE_URL: ${AUTH_BASE_URL:?AUTH_BASE_URL obrigatorio}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN obrigatorio}

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile.prod
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obrigatorio}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET obrigatorio}
      AUTH_BASE_URL: ${AUTH_BASE_URL:?AUTH_BASE_URL obrigatorio}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN obrigatorio}
      PORT: ${API_PORT:-4100}
      HOST: 0.0.0.0
      # Webhook de importacao de NF-e (opcional). Sem os dois, a rota de importacao responde 422.
      NOTAS_FISCAIS_URL: ${NOTAS_FISCAIS_URL:-}
      NOTAS_FISCAIS_TOKEN: ${NOTAS_FISCAIS_TOKEN:-}
      # Identificador FIXO da contabilidade no filtro (nao e o CNPJ da empresa). Default = contabilidade atual.
      NOTAS_FISCAIS_COMPANY: ${NOTAS_FISCAIS_COMPANY:-08351168000153}
      # Leitura assistida de nota fiscal: segredo somente no ambiente do backend.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-90000}
      # WhatsApp de Compras (doc 57 §7): o sistema manda a cotacao e o "pode entregar". Sem provedor, a fila
      # espera e a tela avisa. O TOKEN e segredo: so no painel do Coolify ou no .env.local ignorado, nunca no Git.
      WHATSAPP_PROVEDOR: ${WHATSAPP_PROVEDOR:-desligado}
      WHATSAPP_META_TOKEN: ${WHATSAPP_META_TOKEN:-}
      WHATSAPP_META_TELEFONE_ID: ${WHATSAPP_META_TELEFONE_ID:-}
      WHATSAPP_META_VERSAO_API: ${WHATSAPP_META_VERSAO_API:-v21.0}
      WHATSAPP_META_MODELO_COTACAO: ${WHATSAPP_META_MODELO_COTACAO:-cotacao_compra}
      WHATSAPP_META_MODELO_CONFIRMACAO: ${WHATSAPP_META_MODELO_CONFIRMACAO:-pedido_confirmado}
      WHATSAPP_META_IDIOMA: ${WHATSAPP_META_IDIOMA:-pt_BR}
      WHATSAPP_WEBHOOK_URL: ${WHATSAPP_WEBHOOK_URL:-}
      WHATSAPP_WEBHOOK_TOKEN: ${WHATSAPP_WEBHOOK_TOKEN:-}
    ports:
      - "${API_PORT:-4100}:${API_PORT:-4100}"
    volumes:
      - padaria_api_storage:/app/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:${API_PORT:-4100}/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 10s
      timeout: 5s
      retries: 30

  web-vue:
    build:
      context: ..
      dockerfile: web-vue/Dockerfile.prod
      args:
        NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:?NUXT_PUBLIC_API_URL obrigatorio}
        PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:?NUXT_PUBLIC_API_URL obrigatorio}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-5174}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  padaria_api_storage:
    name: padaria_api_storage
