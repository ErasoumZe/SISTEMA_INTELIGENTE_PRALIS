services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-padaria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-padaria}
      POSTGRES_DB: ${POSTGRES_DB:-padaria}
    ports:
      - "${POSTGRES_PORT:-5543}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-padaria} -d ${POSTGRES_DB:-padaria}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - padaria_postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile.dev
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-padaria}:${POSTGRES_PASSWORD:-padaria}@db:5432/${POSTGRES_DB:-padaria}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-secret-change-me-dev-secret-change-me}
      AUTH_BASE_URL: http://localhost:${API_PORT:-4100}
      WEB_ORIGIN: http://localhost:${WEB_PORT:-5174}
      PORT: ${API_PORT:-4100}
      HOST: 0.0.0.0
    ports:
      - "${API_PORT:-4100}:4100"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:4100/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 5s
      timeout: 5s
      retries: 30

  web-vue:
    build:
      context: ..
      dockerfile: web-vue/Dockerfile.dev
    environment:
      NODE_ENV: development
      PUBLIC_API_URL: http://localhost:${API_PORT:-4100}
      NUXT_PUBLIC_API_URL: http://localhost:${API_PORT:-4100}
      PORT: ${WEB_PORT:-5174}
    ports:
      - "${WEB_PORT:-5174}:5174"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:5174'').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  padaria_postgres_data:
