services:
  api:
    environment:
      PORT: ${API_PORT:-4100}
      HOST: 0.0.0.0
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:${API_PORT:-4100}/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 5s
      timeout: 5s
      retries: 30
