# Deploy no Coolify: ele roda `docker compose` com --project-directory = RAIZ do repo
# (nao a pasta infra/). Por isso os `context` sao relativos a raiz (`.`), e nao `..`.
services:
  migrate:
    build:
      context: .
      dockerfile: api/Dockerfile.prod
      target: build
    # Aplica migrations (drizzle + better-auth) e, em seguida, o bootstrap idempotente de
    # producao (catalogo, permissoes padrao dos cargos, 1a empresa e primeiro admin). A API so sobe depois
    # que este passo conclui com sucesso (depends_on: service_completed_successfully).
    # Migrations + bootstrap idempotente. Por fim, o seed de referencia — que so faz algo se
    # SEED_REFERENCIA=1 (senao sai na hora). Assim voce popula a producao uma vez ligando a flag
    # no Coolify e deployando; depois desliga a flag e os proximos deploys nao re-semeiam.
    command:
      [
        "sh",
        "-c",
        "npm run api:prod:migrate --workspace @padaria/api && npm run bootstrap:prod --workspace @padaria/db && { npm run seed:referencia:prod --workspace @padaria/db || echo '[seed-referencia] AVISO: falhou; deploy segue (API nao bloqueada)'; }"
      ]
    restart: "no"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obrigatorio}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET obrigatorio}
      AUTH_BASE_URL: ${AUTH_BASE_URL:?AUTH_BASE_URL obrigatorio}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN obrigatorio}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL obrigatorio}
      # Necessaria somente na primeira instalacao. Depois que ADMIN_EMAIL ja existe, o bootstrap
      # preserva a credencial e a variavel pode ficar vazia sem transformar deploy em rotacao.
      ADMIN_SENHA: ${ADMIN_SENHA:-}
      ADMIN_NOME: ${ADMIN_NOME:-Administrador}
      EMPRESA_NOME: ${EMPRESA_NOME:-Padaria Principal}
      # Ligue para popular a producao uma vez (dados de referencia + exemplos); depois remova.
      SEED_REFERENCIA: ${SEED_REFERENCIA:-}
    # padaria_prod (interna) + coolify (alcanca o Postgres gerenciado do Coolify pelo host interno)
    networks:
      - padaria_prod
      - coolify

  api:
    build:
      context: .
      dockerfile: api/Dockerfile.prod
    labels:
      - traefik.docker.network=coolify
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL obrigatorio}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET obrigatorio}
      AUTH_BASE_URL: ${AUTH_BASE_URL:?AUTH_BASE_URL obrigatorio}
      WEB_ORIGIN: ${WEB_ORIGIN:?WEB_ORIGIN obrigatorio}
      PORT: 4100
      HOST: 0.0.0.0
      # OAuth e destinos Google da admissao. Os valores devem ser cadastrados como secrets/env
      # no Coolify; nunca entram neste arquivo versionado.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      GOOGLE_DRIVE_FOLDER_ID: ${GOOGLE_DRIVE_FOLDER_ID:-}
      GOOGLE_SPREADSHEET_ID: ${GOOGLE_SPREADSHEET_ID:-}
      GOOGLE_ADMISSAO_SYNC_ENABLED: ${GOOGLE_ADMISSAO_SYNC_ENABLED:-false}
      CONPLUS_GOOGLE_SYNC_ENABLED: ${CONPLUS_GOOGLE_SYNC_ENABLED:-false}
      # E-mail transacional (recuperacao de senha + verificacao), via Resend. Estavam declaradas no
      # .env.example e lidas pelo env.ts, mas NAO eram repassadas aqui — e o compose so injeta no
      # container o que esta listado neste bloco. Sem elas o link de recuperacao nunca sai por
      # e-mail em producao. Os VALORES continuam sendo secrets do painel do Coolify.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      # Webhook de importacao de NF-e (opcional). Sem os dois, a rota de importacao responde 422
      # e o resto do sistema segue normal. Defina os valores como secrets no painel do Coolify.
      NOTAS_FISCAIS_URL: ${NOTAS_FISCAIS_URL:-}
      NOTAS_FISCAIS_TOKEN: ${NOTAS_FISCAIS_TOKEN:-}
      # Identificador FIXO da contabilidade no filtro (nao e o CNPJ da empresa). Default = contabilidade atual.
      NOTAS_FISCAIS_COMPANY: ${NOTAS_FISCAIS_COMPANY:-08351168000153}
      # Leitura assistida de nota fiscal. A chave nunca entra no bundle do PWA: configure-a
      # somente como segredo no Coolify. Sem chave, a funcionalidade informa indisponibilidade.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_MS: ${GEMINI_TIMEOUT_MS:-90000}
    restart: unless-stopped
    expose:
      - "4100"
    volumes:
      - padaria_api_storage:/app/storage
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:4100/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"'
        ]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - padaria_prod
      - coolify

  web-vue:
    build:
      context: .
      dockerfile: web-vue/Dockerfile.prod
      args:
        NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:?NUXT_PUBLIC_API_URL obrigatorio}
        PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:?NUXT_PUBLIC_API_URL obrigatorio}
    labels:
      - traefik.docker.network=coolify
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:?NUXT_PUBLIC_API_URL obrigatorio}
      PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL:?NUXT_PUBLIC_API_URL obrigatorio}
    restart: unless-stopped
    expose:
      - "8080"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - padaria_prod
      - coolify

networks:
  padaria_prod:
    name: padaria_prod
  coolify:
    external: true
    name: coolify

volumes:
  padaria_api_storage:
    name: padaria_api_storage
