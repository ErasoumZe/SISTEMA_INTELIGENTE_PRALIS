server {
  listen 8080;
  server_name _;
  # Atras do proxy do Coolify, redirecionamentos absolutos usavam a porta interna 8080.
  # Uma Location relativa preserva o HTTPS, o host e a porta publica vistos pelo navegador.
  absolute_redirect off;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
