name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualidade:
    name: Lint, typecheck, unit e build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Lint (builda shared/db antes)
        run: npm run lint
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Typecheck + arquitetura + texto
        run: npm run check
      - name: Testes unitarios
        run: npm run test:unit --workspace @padaria/tests
      - name: Testes de front (web-vue)
        run: npm run test --workspace @padaria/web-vue
      - name: Build completo
        run: npm run build

  integracao:
    name: Testes de integracao (Testcontainers)
    runs-on: ubuntu-latest
    # A suite e serializada para isolar Testcontainers. A execucao completa
    # aprovada localmente pode levar cerca de 48 minutos.
    timeout-minutes: 60
    env:
      TEST_TIMEOUT_MS: "3300000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Suite de integracao
        run: npm test
